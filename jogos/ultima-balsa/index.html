rgin:12px 0 24px;max-width:29em}.play,.primary{background:#f9be54;color:#233426;border:1px solid #ffd77c;border-radius:8px;font-weight:bold;padding:13px 24px;box-shadow:0 3px 0 #9b6d2f}.play{display:flex;gap:13px;align-items:center;font-size:19px}.play:hover,.primary:hover{background:#ffcf77}.secondary{background:#263b2e;border:1px solid #8c9676;border-radius:8px;padding:12px 18px}.homeBtns{display:flex;align-items:center;gap:12px}.homeBtns .secondary{background:#1a322abf}.place{position:absolute;bottom:4%;right:3%;font:700 10px monospace;text-transform:uppercase;letter-spacing:2px;color:white;text-shadow:0 1px 5px #000}.overlay{position:absolute;inset:0;display:grid;place-items:center;background:#10221990;backdrop-filter:blur(3px)}.card{max-width:92%;max-height:94%;overflow:auto;border:1px solid #9a9b67;border-radius:14px;background:#20392ef7;padding:clamp(16px,3vw,38px);text-align:center;box-shadow:0 16px 60px #0c211b66}.card h2{font:bold clamp(24px,3vw,47px)/1.06 Georgia,serif;letter-spacing:-.04em;margin:6px 0 13px;color:#ffce77}.card p{line-height:1.5;margin:9px auto 16px;max-width:46ch}.options{display:flex;gap:10px;justify-content:center}.pick{max-width:230px;flex:1;background:#304a39;border:1px solid #798c67;border-radius:8px;padding:15px;text-align:left}.pick b,.pick small{display:block}.pick b{color:#ffcf78;margin:8px 0}.pick small{line-height:1.4;color:#e3e5cf}.pick:hover{border-color:#ffca69}.hud,.controls{position:absolute;display:flex;align-items:center;justify-content:space-between;pointer-events:none;left:3%;right:3%}.hud{top:4%;justify-content:flex-end;gap:8px}.hud span,.hud button,.controls button,.route button{background:#162b22e8;border:1px solid #a3a77b;border-radius:8px;padding:8px 12px;font-weight:bold}.hud span{font:700 16px monospace}.hud button,.controls button,.route button{pointer-events:auto}.controls{bottom:5%}.controls button{touch-action:none;user-select:none;min-width:90px;padding:14px;color:#ffe1a3}.controls{gap:8px}.controls #accel </style></head><body><header><strong><i class="mark" id="bikeIcon"></i>PALMITECO</strong><div class="header-actions"><button class="icon" id="sound" aria-label="Silenciar"></button><button class="icon" id="help" aria-label="Como jogar">?</button></div></header><main id="stage"><canvas id="view" aria-label="Estrada de terra de Palmital até o Rio Piquiri"></canvas><section id="home"><div class="eyebrow">Palmital · Paraná</div><h1>Palmiteco<em>e a Última<br>Balsa</em></h1><p>Uma bicicleta, um caixote de latinhas e a última travessia do Rio Piquiri.</p><div class="homeBtns"><button class="play" id="play">▶ &nbsp; Jogar</button><button class="secondary" id="records">Recordes</button></div><span class="place">Rio Piquiri · PR</span></section><div class="hud hide" id="hud"><span id="clock"></span><span id="cargo"></span><button id="pause" aria-label="Pausar">Ⅱ</button></div><div class="controls hide" id="controls"><button id="brake">↓ Freio</button><button id="accelerate">↑ Acelerar</button><button id="jump">↥ Salto</button></div><div class="route hide" id="route"><button id="barnRoad">2 · Galpão ↗</button><button id="direct">1 · Atalho →</button></div><div id="notice" hidden></div><section id="modal" class="overlay hide"><div id="card" class="card"></div></section></main><footer><span>Criado por <b>Willian Ferreira</b></span><span class="legend"><span><kbd>↑</kbd> Acelerar</span><span><kbd>↓</kbd> Frear</span><span><kbd>Espaço</kbd> Saltar</span><span><kbd>1 / 2</kbd> Escolher</span></span><span id="tilt">Gire o celular para jogar na horizontal.</span></footer><script>/* Painted layers repeat in world space so the horizon and the near pastures travel at different speeds. */
(function () {
  "use strict";
  const W = 1200, H = 600, TAU = Math.PI * 2;
  let layers;
  function random(seed) {
    return () => ((seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0) / 4294967296);
  }
  function surface(w = W, h = H) {
    const canvas = document.createElement("canvas");
    canvas.width = w; canvas.height = h;
    return [canvas, canvas.getContext("2d")];
  }
  function poly(c, color, pts) {
    c.fillStyle = color;
    c.beginPath(); c.moveTo(pts[0], pts[1]);
    for (let i = 2; i < pts.length; i += 2) c.lineTo(pts[i], pts[i+1]);
    c.closePath(); c.fill();
  }
  function line(c, color, width, x, y, x2, y2) {
    c.strokeStyle=color; c.lineWidth=width; c.beginPath(); c.moveTo(x,y); c.lineTo(x2,y2); c.stroke();
  }
  function oval(c, color, x, y, rx, ry) {
    c.beginPath(); c.ellipse(x,y,rx,ry,0,0,TAU); c.fillStyle=color; c.fill();
  }
  function cloud(c,x,y,s,tint) {
    c.save(); c.translate(x,y); c.scale(s,s);
    c.beginPath(); c.moveTo(-98,8);
    c.bezierCurveTo(-87,7,-81,0,-61,1); c.bezierCurveTo(-62,-8,-45,-13,-34,-10);
    c.bezierCurveTo(-27,-31,4,-30,16,-16); c.bezierCurveTo(29,-18,40,-14,49,-5);
    c.bezierCurveTo(67,-3,83,1,98,7); c.bezierCurveTo(45,10,-48,12,-98,8);
    c.fillStyle=tint; c.fill();
    line(c,"rgba(255,238,173,.54)",1,-76,12,48,12);
    c.restore();
  }
  function ridgeAt(x, level) {
    const p=x/W*TAU;
    const params=[
      [259,42,16,7,1.36], [294,33,21,6,2.65], [338,42,17,7,.75], [389,36,16,4,3.1]
    ][level];
    return params[0]+params[1]*Math.sin(p+params[4])+params[2]*Math.sin(p*2+.5+level)
      +params[3]*Math.cos(5*p+level)+1.7*Math.sin(13*p+level);
  }
  function ridge(level, fill, ink) {
    const [img,c]=surface(), r=random(132+level);
    c.beginPath(); c.moveTo(0,H);
    for(let x=0;x<=W;x+=4)c.lineTo(x,ridgeAt(x,level));
    c.lineTo(W,H); c.closePath(); c.fillStyle=fill; c.fill();
    c.save(); c.clip();
    for(let i=0;i<16;i++) {
      const x=r()*W,y=ridgeAt(x,level)+r()*25;
      poly(c,ink,[x-17,y-32,x+19,y+4,x+62+r()*60,y+26,x+106+r()*82,y+47,x+66,y+28,x+14,y+13]);
    }
    for(let i=0;i<210;i++){
      const x=r()*W,y=ridgeAt(x,level)+5+r()*75;
      line(c,ink,.75,x,y,x+2+r()*5,y+.6);
    }
    c.restore(); return img;
  }
  function araucaria(c,x,y,s,ink,light) {
    c.save(); c.translate(x,y); c.scale(s,s);
    poly(c,ink,[-2,1,1,-44,3,-46,2,-4,5,1]);
    for(const [bx,by,wide] of [[-14,-34,11],[13,-38,12],[-8,-45,11],[6,-47,13],[-2,-50,9]]) {
      c.strokeStyle=ink; c.lineWidth=1.65; c.beginPath();c.moveTo(1,by+10); c.quadraticCurveTo(bx,by+8,bx,by);c.stroke();
      poly(c,ink,[bx-wide,by+1,bx-wide*.73,by-2,bx-wide*.52,by-2,bx-wide*.4,by-4,bx-wide*.25,by-3,bx,by-5,bx+wide*.25,by-4,bx+wide*.49,by-3,bx+wide*.71,by-3,bx+wide,by,bx+wide*.28,by+2,bx-wide*.6,by+2]);
      line(c,light,.8,bx-wide*.65,by-2,bx-2,by-3.4);
    }
    c.restore();
  }
  function broadleaf(c,x,y,s,ink,lit) {
    c.save(); c.translate(x,y); c.scale(s,s);
    poly(c,ink,[-2,0,-1,-16,-8,-23,-4,-23,1,-17,6,-25,8,-25,2,-15,3,0]);
    [[-10,-20,9,5],[-6,-25,9,7],[5,-24,11,7],[0,-29,8,6],[14,-19,6,5]].forEach(a=>oval(c,ink,...a));
    oval(c,lit,-2,-30,7,3.4); oval(c,lit,6,-27,5,2.4);c.restore();
  }
  function house(c,x,y,s) {
    c.save(); c.translate(x,y); c.scale(s,s);
    oval(c,"#6d7855",1,1,33,4);
    poly(c,"#d49a66",[-20,-1,-20,-15,6,-17,6,0]);
    poly(c,"#b57e57",[6,0,6,-17,16,-24,26,-16,26,-2]);
    poly(c,"#975d47",[-24,-14,-13,-25,17,-26,5,-15]);
    poly(c,"#73534b",[5,-15,17,-27,29,-16,25,-16,16,-23,8,-14]);
    line(c,"#efba79",1.5,-15,-24,16,-26);
    c.fillStyle="#665e4c";c.fillRect(-14,-11,5,6);c.fillRect(-5,-12,5,11);c.fillRect(15,-13,5,6);
    c.restore();
  }
  function build() {
    const [sky,c]=surface(); const gr=c.createLinearGradient(0,0,0,395);
    gr.addColorStop(0,"#edaa70");gr.addColorStop(.52,"#ffd18b");gr.addColorStop(.89,"#ffe5a4");gr.addColorStop(1,"#eed297");
    c.fillStyle=gr;c.fillRect(0,0,W,H);
    const halo=c.createRadialGradient(858,161,28,858,161,186);
    halo.addColorStop(0,"rgba(255,238,158,.76)");halo.addColorStop(1,"rgba(255,236,155,0)");
    c.fillStyle=halo;c.fillRect(650,0,415,360);
    oval(c,"#fff2af",858,161,42,42);
    cloud(c,161,99,.55,"#ffe0a2");cloud(c,402,142,.74,"#ffe3a5");
    cloud(c,655,84,.7,"#ffe2a5");cloud(c,1030,94,1.15,"#ffe4ab");cloud(c,841,193,.48,"#ffe8b2");
    for(const [x,y,s] of [[743,116,1],[757,109,.74],[769,117,.58],[563,185,.67]]) {
      c.strokeStyle="#a0795f";c.lineWidth=1.1;c.beginPath();c.moveTo(x-5*s,y-2*s);c.quadraticCurveTo(x-2*s,y-2*s,x,y+s);c.quadraticCurveTo(x+2*s,y-3*s,x+6*s,y-3*s);c.stroke();
    }
    const hills=[
      ridge(0,"#bc997d","rgba(136,111,105,.16)"),
      ridge(1,"#aa9a76","rgba(104,103,84,.16)"),
      ridge(2,"#8e9876","rgba(79,104,88,.17)"),
      ridge(3,"#838f61","rgba(79,103,69,.19)")
    ];
    const [pasture,p]=surface(),r=random(421);
    p.save();p.beginPath();p.moveTo(0,H);for(let x=0;x<=W;x+=5)p.lineTo(x,ridgeAt(x,3));p.lineTo(W,H);p.closePath();p.clip();
    for(let i=0;i<20;i++){
      const x=i*74-160,y=ridgeAt(x,3)-4;
      p.beginPath();p.moveTo(x,y);p.bezierCurveTo(x+65,y+32,x+51,y+48,x+142,y+76);p.lineTo(x+238,H);p.lineTo(x+116,H);
      p.bezierCurveTo(x+128,y+64,x+40,y+48,x,y);
      p.fillStyle=["#a5a36b","#99a16a","#909a62","#b5a26e"][i%4];p.fill();
    }
    for(let i=0;i<750;i++){
      const x=r()*W,y=ridgeAt(x,3)+4+r()*138;
      line(p,"rgba(58,85,55,.18)",.85,x,y,x+2+r()*5,y-.5);
    }
    p.restore();
    for(let i=0;i<23;i++) {
      const x=r()*W,y=ridgeAt(x,3)+.9+r()*7;
      broadleaf(p,x,y,.18+r()*.24,"#687c62","#88946c");
    }
    for(const x of [249,264,447,609,1050,1075,1102]) araucaria(p,x,ridgeAt(x,3)+4,.36+r()*.27,"#5d7560","#82906e");
    for(const start of [297,631,1012]) {
      let last;
      for(let n=0;n<8;n++) {
        const x=start+n*10, y=ridgeAt(x,3)+23+n*.32;
        line(p,"#6d7555",1.7,x,y,x+.4,y-5);
        if(last)line(p,"#797d5b",.9,last[0],last[1]-3,x,y-3);
        last=[x,y];
      }
    }
    house(p,601,ridgeAt(601,3)+19,.65);house(p,568,ridgeAt(568,3)+16,.43);
    const water=surface(),w=water[1], g=w.createLinearGradient(0,326,0,600);
    g.addColorStop(0,"#eed08a");g.addColorStop(.37,"#ceb779");g.addColorStop(1,"#8fa992");
    function bank(y) {
      const t=(y-338)/262;
      const center=866+49*Math.sin(t*6.7-.5)-93*t+123*t*t;
      const half=4+15*t+235*t*t;
      return [center-half,center+half];
    }
    const edge=[];
    for(let y=338;y<=600;y+=2){let b=bank(y);edge.push([b[0],b[1],y]);}
    w.beginPath();edge.forEach(([l,,y],i)=>i?w.lineTo(l,y):w.moveTo(l,y));
    edge.slice().reverse().forEach(([,rr,y])=>w.lineTo(rr,y));w.closePath();w.fillStyle=g;w.fill();w.save();w.clip();
    for(let i=0;i<630;i++){
      const y=340+r()*260,[l,rr]=bank(y),x=l+r()*(rr-l),t=(y-338)/262;
      line(w,["#ffdfa0","#f4d497","#b3a778","#f8df9d"][i%4],.6+t*.7,x,y,x+1+r()*25*t,y);
    }
    w.restore();
    for(let i=0;i<edge.length-1;i+=2){
      const [l,rr,y]=edge[i], [l2,rr2,y2]=edge[i+1];
      line(w,"#858c67",1.3,l,y,l2,y2);
      line(w,"#d0b483",1.5,rr,y,rr2,y2);
    }
    const [paper,grain]=surface(144,144), data=grain.createImageData(144,144);
    for(let i=0;i<data.data.length;i+=4) {
      const dark=r()>.55;
      data.data[i]=dark?74:255;data.data[i+1]=dark?51:239;data.data[i+2]=dark?39:193;data.data[i+3]=Math.floor(r()*15);
    }
    grain.putImageData(data,0,0);
    return {sky,hills,pasture,water:water[0],paper};
  }
  function repeat(c,img,phase) {
    const x=-(((phase%W)+W)%W);
    c.drawImage(img,x,0); if(x<0)c.drawImage(img,x+W,0);
  }
  function drawLandscape(c,cameraX,time,isMenu) {
    if(!layers)layers=build();
    const scroll=isMenu?0:(Number(cameraX)||0);
    c.save(); c.drawImage(layers.sky,0,0);
    const speeds=[.013,.025,.045,.08];
    layers.hills.forEach((img,i)=>repeat(c,img,scroll*speeds[i]));
    repeat(c,layers.pasture,scroll*.08);
    // A distant river stays in view as the road winds along its valley.
    const drift=isMenu?0:42*Math.sin(scroll*.00032);c.drawImage(layers.water,drift,0);
    if(isMenu)drawFerry(c,880,389,.29,0,0);
    if(!layers.pattern)layers.pattern=c.createPattern(layers.paper,"repeat");
    c.fillStyle=layers.pattern;c.fillRect(0,0,W,H);c.restore();
  }
  function drawFerry(c,x,y,scale,departure,raised) {
    c.save();c.translate(x,y);c.scale(scale,scale);
    const up=Math.max(0,Math.min(1,Number(raised)||0));
    poly(c,"#536c65",[-2,3,145,3,139,11,21,16,3,13]);
    poly(c,"#a36545",[-2,1,147,0,143,7,6,10]);
    poly(c,"#705749",[-2,0,4,-3,146,-4,148,0]);
    line(c,"#e4aa66",2,5,6,139,3);
    c.save();c.rotate(up*1.18);
    poly(c,"#a87950",[-71,0,2,-1,3,2,-70,4]);
    for(let n=-65;n<-3;n+=8)line(c,"#705a45",1,n,.2,n-1,2.5);c.restore();
    const dark="#405c55";
    for(const n of [21,49,77,103,134])line(c,dark,2,n,-3,n,-14);
    line(c,dark,1.5,20,-14,135,-14);
    poly(c,"#d5bd86",[93,-4,92,-31,115,-33,129,-22,131,-4]);
    poly(c,"#688378",[96,-27,113,-28,116,-18,96,-17]);
    poly(c,"#4e6c64",[116,-28,124,-22,126,-18,120,-18]);
    poly(c,"#714e40",[88,-32,114,-36,124,-31,116,-29,90,-29]);
    line(c,dark,2,41,-3,38,-34);line(c,dark,2,83,-4,81,-34);
    poly(c,"#c08151",[31,-35,83,-37,88,-34,34,-31]);
    line(c,dark,1.5,10,-2,10,-29);
    poly(c,"#deaa5d",[11,-28,22,-25,11,-22]);
    oval(c,"#344b47",21,6,4.5,5.5);oval(c,"#9c825d",21,6,2,3);
    oval(c,"#344b47",123,5,4.5,5.5);oval(c,"#9c825d",123,5,2,3);
    c.restore();
  }
  window.drawLandscape=drawLandscape;
  window.drawFerry=drawFerry;
})();

function drawRider(ctx, x, y, angle, scale, phase, uphill, bounce, parked) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle || 0);
  ctx.scale(scale, scale);
  const ink = '#263832', straw = '#e9b75c', teal = '#33897a';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  function path(d, fill, edge = ink, weight = 1) {
    const p = new Path2D(d);
    if (fill) {ctx.fillStyle = fill; ctx.fill(p);}
    if (edge) {ctx.strokeStyle = edge; ctx.lineWidth = weight; ctx.stroke(p);}
  }
  function line(ax, ay, bx, by, color, w) {
    ctx.strokeStyle=color; ctx.lineWidth=w; ctx.beginPath();
    ctx.moveTo(ax,ay); ctx.lineTo(bx,by); ctx.stroke();
  }
  function oval(cx, cy, rx, ry, fill, edge, w = 1) {
    ctx.beginPath(); ctx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
    if(fill) {ctx.fillStyle=fill; ctx.fill();}
    if(edge) {ctx.lineWidth=w;ctx.strokeStyle=edge;ctx.stroke();}
  }
  function wheel(cx) {
    oval(cx,-13.5,12.05,12.05,null,ink,2.9);
    oval(cx,-13.5,10.6,10.6,null,'#d5c6a0',1.3);

 let cam=g.x-326;drawLandscape(ctx,cam,elapsed,false);let end=g.x>=L-1300,depart=g.endTime||0,shift=g.won?Math.max(0,depart-1.5)*58:Math.max(0,depart-.85)*56;
 if(end){ctx.fillStyle='#78948a';ctx.fillRect(L-cam,426,W,190);for(let i=0;i<60;i++){let x=L-cam+hash(i)*850,y=433+hash(i+33)*160;path([[x+Math.sin(elapsed+i)*3,y],[x+10+hash(i+9)*59,y]],null,i%3?'#9dac91':'#ebc485',2)}drawFerry(ctx,L+69-cam+shift,427,1,0,g.won?smooth((depart-1.3)/.65):smooth(depart/.8))}

function bikeAt(cam){let p=pose(g.x,g.road);let ex=g.x;if(g.endTime&&g.won)ex=L+smooth(g.endTime/1.35)*107+Math.max(0,g.endTime-1.5)*58;else if(g.endTime)ex=L-8;let px=ex-cam;oval(px,p.y+2,32*p.s,3.6*p.s,'#664a384d');drawRider(ctx,px,p.y-g.height,p.a,p.s,g.phase+(g.won?Math.min(g.endTime,1.35)*6:0),p.a<-.03,g.bounce*3,g.lock>0||state==='trade'||g.endTime>1.35)}
function frame(t){let dt=last?Math.min(.1,(t-last)/1000):0;last=t;if(!document.hidden){elapsed+=dt;menuMotion+=dt;remainder+=dt;while(remainder>=1/60){update(1/60);remainder-=1/60}draw()}requestAnimationFrame(frame)}
function info(kind){let body=kind==='help'?'<h2>Como jogar</h2><p>A bicicleta desce sozinha. Solte o freio para ganhar embalo e salte antes do barro. Chegue à balsa antes das 18h.</p><p>Segure ↑ para acelerar ou ↓ para frear e aperte Espaço para saltar. Use 1 ou 2 nas escolhas. No celular, use os botões e toque nas placas.</p>':'<h2>Recordes no aparelho</h2>'+(scores.length?scores.slice(0,5).map((v,i)=>'<p>'+(i+1)+'º · '+Number(v.t).toFixed(2).replace('.',',')+' s · '+Number(v.c)+' latinhas</p>').join(''):'<p>Complete a travessia para registrar sua primeira marca.</p>');modal('info',body+button('close','Voltar'));$('close').onclick=home}
$('play').onclick=chooseParts;$('help').onclick=()=>{if(state==='menu')info('help')};$('records').onclick=()=>info('scores');$('pause').onclick=pause;$('barnRoad').onclick=()=>route('barn');$('direct').onclick=()=>route('direct');
function touch(id,down,up){let el=$(id);el.addEventListener('pointerdown',e=>{e.preventDefault();el.setPointerCapture(e.pointerId);down()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,up)}
touch('accelerate',()=>accelerating=true,()=>accelerating=false);touch('brake',()=>brake=true,()=>brake=false);touch('jump',jump,()=>{});
window.addEventListener('keydown',e=>{let k=e.code;if(k==='Escape'){e.preventDefault();if(state==='pause')resume();else pause();return}if(!['Space','ArrowDown','ArrowUp','Digit1','Digit2','Numpad1','Numpad2'].includes(k))return;if(state==='menu'||state==='info'||state==='result')return;e.preventDefault();keys.add(k);if(e.repeat)return;if(k==='Space')jump();if(k.endsWith('1')||k.endsWith('2')){let i=Number(k.slice(-1))-1;if(state==='kit')start(offered[i]);else if(state==='run')route(i?'barn':'direct');else if(state==='trade')tradeChoice(!i)}});
window.addEventListener('keyup',e=>keys.delete(e.code));document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();last=0;remainder=0});window.addEventListener('blur',()=>pause());window.addEventListener('contextmenu',e=>{if(state==='run')e.preventDefault()});
